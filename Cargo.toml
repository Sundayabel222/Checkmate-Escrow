[workspace]
members = [
    "contracts/escrow",
    "contracts/oracle",
    "e2e-tests",
]
# Default members exclude e2e-tests: it is a host-only test harness (it reads
# the release WASM artifacts from disk) and must not be compiled for wasm by
# plain `cargo build`/`cargo test`. Run it explicitly with `cargo test -p e2e-tests`.
default-members = [
    "contracts/escrow",
    "contracts/oracle",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
